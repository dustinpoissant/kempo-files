name: Run Unit Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  # kempo/kempo-ui/kempo-server resolve from the registry, which is what a site installing this
  # extension gets. Peer dependencies are installed automatically by npm ci.
  published:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    services:
      # The API-contract and data-layer suites need a real database; they skip themselves when
      # none is reachable, so this is what makes them actually run rather than silently pass.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kempo
          POSTGRES_PASSWORD: kempo
          POSTGRES_DB: kempo_files_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://kempo:kempo@localhost:5432/kempo_files_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - run: npm ci

      # kempo/kempo-ui/kempo-server are peer dependencies, which npm ci does not install.
      - name: Install the host for the test gate
        run: npm install --no-save kempo@latest kempo-ui@latest kempo-server@latest

      - name: Apply database schema
        run: npx drizzle-kit push --force

      - name: Run Unit Tests
        run: npm test

  # Same suite against the sibling checkout of the host. This extension resolves imports out of
  # kempo, so it breaks whenever the host moves something it reaches into — this job is what
  # surfaces that before a release, and it is advisory rather than blocking.
  siblings:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      # Without this the database-backed suites skip themselves, which reads as a pass.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kempo
          POSTGRES_PASSWORD: kempo
          POSTGRES_DB: kempo_files_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://kempo:kempo@localhost:5432/kempo_files_test
    steps:
      - uses: actions/checkout@v4
        with:
          path: kempo-files

      - uses: actions/checkout@v4
        with:
          repository: dustinpoissant/kempo
          path: kempo

      - uses: actions/checkout@v4
        with:
          repository: dustinpoissant/kempo-server
          path: kempo-server

      # kempo's own link:local script links both kempo-server and kempo-ui as siblings, so this
      # checkout needs to exist even though kempo-files itself doesn't import kempo-ui server-side.
      - uses: actions/checkout@v4
        with:
          repository: dustinpoissant/kempo-ui
          path: kempo-ui

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install host
        run: npm ci && npm run link:local
        working-directory: kempo

      - run: npm ci
        working-directory: kempo-files

      - name: Link sibling checkouts
        run: npm run link:local
        working-directory: kempo-files

      - name: Apply database schema
        run: npx drizzle-kit push --force
        working-directory: kempo-files

      - name: Run Unit Tests
        run: npm test
        working-directory: kempo-files
